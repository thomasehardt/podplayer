<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PodPlayer — Web Podcast Experience</title>
    <meta name="description" content="Discover, stream, and organize your favorite podcasts with dynamic audio visualizer, RSS support, and persistent listening history." />
    <meta name="color-scheme" content="dark light" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
      (function() {
        const theme = localStorage.getItem('podplayer_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        const colorSchemeMeta = document.querySelector('meta[name="color-scheme"]');
        if (colorSchemeMeta) {
          colorSchemeMeta.content = theme === 'light' ? 'light dark' : 'dark light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
